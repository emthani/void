<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>VOID</title>
<link rel="icon" type="image/png" href="1.png" />
<link rel="apple-touch-icon" href="1.png" />
<meta name="apple-mobile-web-app-title" content="VOID" />
<meta name="theme-color" content="#ffffff" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    min-height: 100%;
    background: #ffffff;
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow-x: hidden;
    overscroll-behavior: none;
    touch-action: pan-y;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 15% 10%, rgba(180, 160, 255, 0.18), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(160, 220, 255, 0.18), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(255, 190, 220, 0.12), transparent 50%),
      #ffffff;
    z-index: -1;
    pointer-events: none;
  }

  /* ---------- Glass Header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    height: 64px;
    padding: 0 18px;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.04);
  }

  .logo-mark {
    width: 34px;
    height: 34px;
    object-fit: contain;
    border-radius: 10px;
    pointer-events: none;
    -webkit-user-drag: none;
    user-drag: none;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.08));
  }

  .logo-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 8px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #0a0a0a 0%, #555 45%, #0a0a0a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    padding-left: 6px;
    position: relative;
    z-index: 1;
  }

  /* ---------- Grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    width: 100%;
    padding: 2px;
  }

  @media (min-width: 640px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
  }
  @media (min-width: 1024px) {
    .grid { grid-template-columns: repeat(6, 1fr); }
  }
  @media (min-width: 1440px) {
    .grid { grid-template-columns: repeat(8, 1fr); }
  }

  .tile {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: transparent;
    cursor: pointer;
  }

  .tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
    user-drag: none;
    opacity: 0;
    transform: translateY(12px) scale(0.98);
    animation: fadeUp 0.5s ease forwards;
    transition: transform 0.35s ease;
  }

  @keyframes fadeUp {
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .tile::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.15);
    opacity: 0;
    transition: opacity 0.25s ease, backdrop-filter 0.25s ease;
    pointer-events: none;
  }

  @media (hover: hover) {
    .tile:hover::after {
      opacity: 1;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .tile:hover img {
      transform: scale(1.06);
    }
  }

  .spacer { height: 40px; }
</style>
</head>
<body>

<header>
  <img src="1.png" alt="" class="logo-mark" draggable="false" />
  <div class="logo-text">VOID</div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="spacer"></div>
</main>

<script>
  /* =========================================================
     تعداد گیف‌ها. هر بار گیف جدید اضافه کردی += 1 کن.
     ========================================================= */
  const TOTAL_GIFS = 10;

  const grid = document.getElementById('grid');

  // جدیدترین بالا → از بزرگ به کوچک (10, 9, ... 1)
  for (let i = TOTAL_GIFS; i >= 1; i--) {
    const tile = document.createElement('div');
    tile.className = 'tile';

    const img = document.createElement('img');
    img.src = `${i}.gif`;
    img.alt = '';
    img.draggable = false;
    img.loading = 'lazy';

    img.onerror = () => tile.remove();

    img.style.animationDelay = `${Math.min(i, 30) * 20}ms`;

    tile.appendChild(img);
    grid.appendChild(tile);
  }

  /* ---------- محافظت‌ها ---------- */
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('selectstart', e => e.preventDefault());

  document.addEventListener('wheel', e => {
    if (e.ctrlKey) e.preventDefault();
  }, { passive: false });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) {
      e.preventDefault();
    }
    if (
      e.key === 'F12' ||
      ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) ||
      ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'u')
    ) {
      e.preventDefault();
    }
  });

  document.addEventListener('touchstart', e => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchmove', e => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  let lastTouch = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouch < 300) e.preventDefault();
    lastTouch = now;
  }, { passive: false });
</script>

</body>
</html>
